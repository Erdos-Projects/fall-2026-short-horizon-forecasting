# Smoke run: a small, fast subset to check that the pipeline executes end to end.
# Results are written under results/smoke/ and are labelled "smoke". They are NOT
# research results: few stocks, fewer folds and smaller models.
extends: default.yaml
run:
  label: smoke
  stocks: 8
  output_dir: results/smoke
  cache_dir: cache/smoke
split:
  outer_folds: 3
  inner_folds: 2
models:
  ridge_alphas: [1.0, 100.0]
  hgb: {max_iter: 60}
upgraded:
  lgb_base: {n_estimators: 150}
  spread_overrides: {n_estimators: 200, learning_rate: 0.05}
  seeds: [0]
  small_overrides: {n_estimators: 100}
  shap_sample: 2000
trading:
  min_inner_trades: 20
bootstrap:
  resamples: 200
robustness:
  fast_hgb_overrides: {max_iter: 40}
